# | Keybinds | chuyển từ niri sang mango, bám theo layout niri
# Shout out to https://claude.ai

# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# ── Quick reset ──
bind = SUPER, r, reload_config

# ── Ứng dụng ──
bind = SUPER, Return, spawn, alacritty
bind = ALT, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, b, spawn, microsoft-edge-stable
bind = SUPER, e, spawn, nautilus
bind = SUPER, z, spawn, zeditor
bind = SUPER, c, spawn, code
bind = SUPER, q, killclient,

# ── Panel Noctalia ──
bind = SUPER, w, spawn, noctalia msg panel-toggle wallpaper
bind = SUPER, n, spawn, noctalia msg panel-toggle noctalia/notes:panel
bind = SUPER, v, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, period, spawn, noctalia msg panel-toggle launcher '/emo'
bind = SUPER+SHIFT, s, spawn, noctalia msg screenshot-region
bind = SUPER+ALT, s, spawn, noctalia msg screenshot-fullscreen
bind = SUPER+ALT+SHIFT, s, spawn, noctalia msg screenshot-fullscreen all
bind = SUPER+ALT, l, spawn, noctalia msg session lock
bind = ALT, F4, spawn, noctalia msg panel-toggle session
bind = SUPER+SHIFT, escape, spawn, noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet
bind = SUPER, grave, toggle_scratchpad,

# ── Media keys ──
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute
bind = NONE, XF86AudioMicMute, spawn, noctalia msg mic-mute
bind = NONE, XF86AudioNext, spawn, noctalia msg media next
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous
bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle
bind = NONE, XF86AudioPause, spawn, noctalia msg media toggle
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# ── Focus theo hướng (cột cuộn ngang = scroller layout, giống niri) ──
bind = SUPER, Left, focusdir, left
bind = SUPER, h, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, l, focusdir, right
bind = SUPER, k, focusdir, up
bind = SUPER, j, focusdir, down

# ── Hoán đổi vị trí cửa sổ/cột theo hướng ──
bind = SUPER+CTRL, Left, exchange_client, left
bind = SUPER+CTRL, h, exchange_client, left
bind = SUPER+CTRL, Right, exchange_client, right
bind = SUPER+CTRL, l, exchange_client, right
bind = SUPER+CTRL, k, exchange_client, up
bind = SUPER+CTRL, j, exchange_client, down

# ── "Workspace dọc" kiểu niri: Up/Down đổi tag ──
bind = SUPER, Down, viewtoright,
bind = SUPER, Up, viewtoleft,
bind = SUPER+CTRL, Down, tagtoright,
bind = SUPER+CTRL, Up, tagtoleft,
bind = SUPER, Tab, view, -1

# ── Tag theo số (workspace 1-9) ──
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# ── Monitor ──
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
bind = SUPER+ALT+CTRL, Left, tagmon, left
bind = SUPER+ALT+CTRL, Right, tagmon, right

# ── Gaps ──
bind = SUPER+SHIFT, x, incgaps, 1
bind = SUPER+SHIFT, z, incgaps, -1
bind = SUPER+SHIFT, r, togglegaps

# ── Bề rộng cột (scroller) ──
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

# ── Chế độ cửa sổ ──
bind = SUPER, t, togglefloating,
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER, o, toggleoverview,
bind = SUPER+SHIFT, o, toggleoverlay,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER+SHIFT, i, restore_minimized, 1

# ── Di chuyển/resize cửa sổ nổi (giữ nguyên, đã khớp niri sẵn) ──
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50, +0
bind = CTRL+SHIFT, Right, movewin, +50, +0

bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# ── Thoát ──
bind = CTRL+ALT, Delete, quit,

# ── Mouse ──
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize

axisbind = SUPER, UP, viewtoleft
axisbind = SUPER, DOWN, viewtoright
axisbind = SUPER+CTRL, UP, tagtoleft
axisbind = SUPER+CTRL, DOWN, tagtoright

# ── Gesture trackpad ──
# 3 ngón: điều hướng tag (giống Up/Down đổi tag bằng phím)
gesturebind = none, up, 3, viewtoright
gesturebind = none, down, 3, viewtoleft
gesturebind = none, left, 3, tagtoleft
gesturebind = none, right, 3, tagtoright

# 4 ngón: điều hướng màn hình (monitor)
gesturebind = none, left, 4, focusmon, left
gesturebind = none, right, 4, focusmon, right
gesturebind = none, up, 4, tagmon, right, 1
gesturebind = none, down, 4, tagmon, left, 1
