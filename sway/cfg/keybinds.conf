# ────────────── Keybindings (converted from niri to sway) ──────────────
# Nguồn gốc: niri config, xem https://github.com/YaLTeR/niri/wiki/Configuration:-Key-Bindings
# noctalia-shell keybinds: https://docs.noctalia.dev/getting-started/keybinds/
#
# Ghi chú quan trọng trước khi dùng:
# - niri là scrollable-tiling (khái niệm "column"), sway là tree-based tiling
#   kiểu i3 (không có "column"). Các lệnh liên quan tới column
#   (center-column, expand-column-to-available-width, focus-column-first/last,
#   maximize-column, toggle-overview...) KHÔNG có tương đương 1:1 trong sway.
#   Mình đã map sang lệnh sway gần nghĩa nhất và ghi chú rõ chỗ nào chỉ là
#   xấp xỉ, chỗ nào bỏ hẳn vì không có khái niệm tương ứng.
# - hotkey-overlay-title="..." là thuộc tính chỉ có ở niri (hiện tên trong
#   overlay phím tắt) → sway không có overlay này nên mình bỏ, giữ lại dưới
#   dạng comment cuối dòng để bạn biết bind đó dùng để làm gì.
# - allow-when-locked=true (niri) → sway dùng flag "--locked" trên bindsym.
# - spawn "cmd" và spawn-sh "cmd" ở niri đều map thành "exec cmd" ở sway vì
#   exec của sway luôn chạy qua shell.
# - Screenshot: niri có lệnh screenshot dựng sẵn, sway thì không — cần cài
#   grim (+ slurp cho vùng chọn). Nhớ cài: sudo pacman -S grim slurp
#   (hoặc apt/dnf tương ứng).
# - "Emergency escape key" (toggle-keyboard-shortcuts-inhibit) không có lệnh
#   tương đương trong sway config — cơ chế shortcuts-inhibitor của sway được
#   xử lý qua Wayland protocol/per-app, không có bind action để toggle thủ
#   công. Mình bỏ bind này, xem ghi chú cuối file.

set $mod Mod4

# ─── Applications ───
bindsym $mod+Return          exec alacritty                                          # Open Terminal: Alacritty
bindsym $alt+space           exec noctalia msg panel-toggle launcher                 # Open App Launcher
bindsym $mod+b               exec microsoft-edge-stable                              # Open Browser: Edge
bindsym $mod+$alt+l          exec noctalia msg session lock                          # Lock Screen
bindsym $alt+F4              exec noctalia msg panel-toggle session                  # Session Menu: noctalia sessionMenu
# ===================Custom===================
bindsym $mod+Shift+Escape    exec noctalia msg panel-toggle kenn/keybind-cheatsheet  # Show Keybindings: keybind-cheatsheet
bindsym $mod+v               exec noctalia msg panel-toggle blackbartblues/clipper:panel  # Show Clipboard: Clipper
bindsym $mod+period          exec noctalia msg panel-toggle launcher '/emo'          # Open Emoji Picker
bindsym $mod+Shift+s         exec noctalia msg screenshot-region                     # Take Screenshot (noctalia)
bindsym $mod+z               exec zeditor                                           # Open: zed
bindsym $mod+c               exec code                                              # Open: VScode
bindsym $mod+w               exec noctalia msg panel-toggle wallpaper
# ============================================

# Chọn file manager tuỳ ý.
bindsym $mod+e               exec nautilus                                          # File Manager: Nautilus

# ─── Media Controls ───
# ==== Output ====
bindsym --locked XF86AudioRaiseVolume  exec noctalia msg volume-up
bindsym --locked XF86AudioLowerVolume  exec noctalia msg volume-down
bindsym --locked XF86AudioMute         exec noctalia msg volume-mute
# ==== Input ====
bindsym --locked Control+XF86AudioRaiseVolume  exec noctalia msg mic-volume-up
bindsym --locked Control+XF86AudioLowerVolume  exec noctalia msg mic-volume-down
bindsym --locked Control+XF86AudioMute         exec noctalia msg mic-mute
# bindsym --locked XF86AudioMicMute    exec noctalia msg mic-mute
# ==== Player ====
bindsym --locked XF86AudioNext   exec noctalia msg media next
bindsym --locked XF86AudioPrev   exec noctalia msg media previous
bindsym --locked XF86AudioPlay   exec noctalia msg media toggle
bindsym --locked XF86AudioPause  exec noctalia msg media toggle

# ─── Brightness Controls ───
bindsym --locked XF86MonBrightnessUp    exec noctalia msg brightness-up
bindsym --locked XF86MonBrightnessDown  exec noctalia msg brightness-down

# ─── Window Movement and Focus ───
bindsym $mod+q                kill

bindsym $mod+Left             focus left
bindsym $mod+h                focus left
bindsym $mod+Right            focus right
bindsym $mod+l                focus right
# bindsym $mod+Up              focus up
bindsym $mod+k                focus up
# bindsym $mod+Down            focus down
bindsym $mod+j                focus down

bindsym $mod+Control+Left     move left
bindsym $mod+Control+h        move left
bindsym $mod+Control+Right    move right
bindsym $mod+Control+l        move right
# bindsym $mod+Control+Up      move up
bindsym $mod+Control+k        move up
# bindsym $mod+Control+Down    move down
bindsym $mod+Control+j        move down

# focus-column-first / focus-column-last / move-column-to-first / move-column-to-last:
# không có khái niệm "column đầu/cuối" trong sway. Gần nhất là di chuyển focus
# tới phần tử đầu/cuối trong container cha, sway không có lệnh sẵn cho việc
# này — bỏ qua 4 bind này.

bindsym $mod+Shift+Left       focus output left
bindsym $mod+Shift+Right      focus output right
bindsym $mod+Shift+Up         focus output up
bindsym $mod+Shift+Down       focus output down

bindsym $mod+Shift+Control+Left   move window to output left
bindsym $mod+Shift+Control+Right  move window to output right
bindsym $mod+Shift+Control+Up     move window to output up
bindsym $mod+Shift+Control+Down   move window to output down

# ─── Workspace Switching ───
# niri "WheelScrollDown/Up" -> nút chuột lăn: button5 = lăn xuống, button4 = lăn lên
bindsym $mod+button5           workspace next
bindsym $mod+button4           workspace prev
bindsym $mod+Down              workspace next
bindsym $mod+Up                workspace prev
bindsym $mod+Control+button5   move container to workspace next
bindsym $mod+Control+button4   move container to workspace prev
bindsym $mod+Control+Down      move container to workspace next
bindsym $mod+Control+Up        move container to workspace prev

# niri "WheelScrollRight/Left" -> button7 = lăn phải, button6 = lăn trái (nếu chuột hỗ trợ)
bindsym $mod+button7            focus right
bindsym $mod+button6            focus left
bindsym $mod+Control+button7    move right
bindsym $mod+Control+button6    move left

bindsym $mod+Shift+button5           focus right
bindsym $mod+Shift+button4           focus left
bindsym $mod+Control+Shift+button5   move right
bindsym $mod+Control+Shift+button4   move left

bindsym $mod+1  workspace number 1
bindsym $mod+2  workspace number 2
bindsym $mod+3  workspace number 3
bindsym $mod+4  workspace number 4
bindsym $mod+5  workspace number 5
bindsym $mod+6  workspace number 6
bindsym $mod+7  workspace number 7
bindsym $mod+8  workspace number 8
bindsym $mod+9  workspace number 9

bindsym $mod+Control+1  move container to workspace number 1
bindsym $mod+Control+2  move container to workspace number 2
bindsym $mod+Control+3  move container to workspace number 3
bindsym $mod+Control+4  move container to workspace number 4
bindsym $mod+Control+5  move container to workspace number 5
bindsym $mod+Control+6  move container to workspace number 6
bindsym $mod+Control+7  move container to workspace number 7
bindsym $mod+Control+8  move container to workspace number 8
bindsym $mod+Control+9  move container to workspace number 9

bindsym $mod+Tab  workspace back_and_forth

# ─── Layout Controls ───
# expand-column-to-available-width / center-column / center-visible-columns:
# đặc thù của mô hình column trong niri, sway không có khái niệm tương ứng
# nên không map được — bỏ qua 3 bind này.
bindsym $mod+minus         resize shrink width 10 ppt
bindsym $mod+equal         resize grow width 10 ppt
bindsym $mod+Shift+minus   resize shrink height 10 ppt
bindsym $mod+Shift+equal   resize grow height 10 ppt

# ─── Modes ───
bindsym $mod+t         floating toggle
bindsym $mod+Shift+f   fullscreen toggle
# maximize-column: sway không có "maximize" kiểu column riêng, dùng
# fullscreen toggle là tương đương gần nhất (đã bind ở Mod+Shift+F).
# Nếu muốn có bind riêng cho "phóng to trong layout" thay vì fullscreen thật,
# có thể thử: bindsym $mod+f layout toggle split
bindsym $mod+f          fullscreen toggle
# bindsym $mod+w        layout toggle tabbed split

# ─── Screenshots ───
# Cần cài grim (và slurp cho vùng chọn tự do): sudo pacman -S grim slurp
bindsym Control+Shift+1  exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bindsym Control+Shift+2  exec grim -o $(swaymsg -t get_outputs | jq -r '.[] | select(.focused) | .name') ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bindsym Control+Shift+3  exec grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# ─── Emergency Escape Key ───
# niri: toggle-keyboard-shortcuts-inhibit, dùng để tắt shortcut-inhibitor khi
# app fullscreen chiếm hết phím tắt. sway không có bind action tương đương —
# cơ chế inhibitor trong sway hoạt động qua protocol keyboard-shortcuts-inhibit
# và thường được app/compositor tự xử lý, không có lệnh IPC để toggle thủ công
# trong file config. Không map được, bỏ qua bind này.

# ─── Exit / Power ───
bindsym Control+$alt+Delete  exit                                # Thoát sway (tương đương "quit" của niri)
bindsym $mod+Shift+p         exec swaymsg "output * dpms off"     # Tắt màn hình (Power off monitors)

# Mod+O (toggle-overview): niri có chế độ overview dựng sẵn để xem toàn bộ
# workspace/column, sway không có tính năng này. Không có tương đương —
# nếu cần thứ gì gần giống, cân nhắc dùng một app riêng như wofi/rofi
# window-switcher, hoặc scroll workspace bằng $mod+button4/button5 ở trên.
