[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 12
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

[colors]
background = "#000000FF"
text_primary = "#babbf1"
text_muted = "#000000"
accent_primary = "#babbf1"
accent_secondary = "#e78284"
warning = "#e78284"
error = "#e78284"
insert_hint = "#babbf180"
backdrop = "#000000FF"
shadow = "#23263470"

[colors.border]
focused = "#babbf1"
unfocused = "#000000"
scratchpad_focused = "#babbf1"
scratchpad_unfocused = "#000000"
outer = "#000000"

[colors.overview]
background_tint = "#00000044"
workspace_background = "#00000044"
badge = "#babbf1"