[input]
middle_click_paste = false
window_drag_toggle = "none"

[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
natural_scroll = false

[input.cursor]
theme = "capitaine-cursors"
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = false
hide_timeout_ms = 0

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.5