[[window_rule]]
# Map from niri: window-rule { geometry-corner-radius 12; clip-to-geometry true; }
# TODO(niri): geometry-corner-radius and clip-to-geometry not found in Umbriel window_rule
# For now, we set only what we can
# match.all = true  # to match all windows? Not sure if we need to match all.
# We'll leave match empty to match all? Actually, empty match matches all.
# But we want to set corner radius and clip for all windows.
# Since we cannot set those, we leave as TODO.
# We'll just create an empty rule that matches all (by having no match criteria) and note that we cannot set the properties.
# However, Umbriel might not allow empty match. We'll set a dummy match that always true? Not sure.
# We'll skip this rule for now and note that we need to set corner radius and clip via other means? Maybe via appearance?
# Actually, corner radius is in appearance.colors? No, corner radius is in appearance.corner_radius.
# We already set corner_radius = 12 in [appearance]. That might be for window corners?
# And clip-to-geometry might be handled by something else? We'll leave TODO.
# For now, we comment out this rule and rely on appearance.corner_radius.
# But note: niri set geometry-corner-radius 12 (which is 12 pixels). We have corner_radius = 12. We'll adjust to 12.
# Let's change appearance.corner_radius to 12.
# We'll do that above.

# Actually, we already set corner_radius = 12 in [appearance]. Let's change it to 12 to match niri.
# We'll update the [appearance] section above.

# For clip-to-geometry, we don't know. We'll leave TODO.

# Since we cannot set the rule, we'll omit it and rely on appearance settings.
# However, we still want to have a rule for steam and notifications below.

[[window_rule]]
match.app_id = "steam"
# TODO(niri): exclude title=r#"^[Ss]team$"# not possible in Umbriel; this rule will make ALL steam windows floating
open-floating = true

[[window_rule]]
match.app_id = "steam"
match.title = "^notificationtoasts_\\d+_desktop$"
default_floating_position = { x = 10, y = 10, anchor = "bottom-right" }
open-focused = false

[[layer_rule]]
match.namespace = "^noctalia-wallpaper.*"
# TODO(niri): place-within-backdrop not found in Umbriel layer_rule
# We'll leave it as is and hope that the wallpaper layer is handled by default? Not sure.

